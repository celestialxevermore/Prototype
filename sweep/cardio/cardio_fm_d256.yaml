program: main_EEE.py
method: bayes

metric:
  name: final/case2_mean_auc
  goal: maximize

parameters:
  exp_mode:
    values: [case2]
  random_seed:
    values: [42, 44, 46, 48, 50]
  sampling_alpha:
    values: [1.0]
  fgw_alpha:
    values: [1.0]
  soft_tau:
    values: [0.05, 0.1]
  source_lr:
    values: [5e-4, 1e-3, 2e-3]
  source_lr_few:
    values: [5e-4, 1e-3]
  dropout_rate:
    values: [0.3]
  hs_reg:
    values: [0.1, 0.3]
  reg:
    values: [0.1, 0.5]
  n_graphs:
    values: [12]
  n_nodes:
    values: [12]
  few_shot:
    values: [32]

command:
  - ${env}
  - /home/eungyeop/anaconda3/envs/protollm/bin/python
  - ${program}
  - ${args}
  - --base_dir
  - sweep_fm_cardio_d256_20260503
  - --source_data
  - Medicaldataset
  - Cardiovascular_Disease_Dataset
  - heart
  - Erbil_Cardiovascular_Health_Dataset
  - cardio_SAheart
  - heart_failure_clinical_records
  - --basis_type
  - graphormer
  - --batch_size
  - "64"
  - --use_amp
  - --llm_model
  - gemma-medical
  - --embed_type
  - carte_d256
  - --input_dim
  - "256"
