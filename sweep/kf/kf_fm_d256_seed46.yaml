program: main_EEE_kf.py
method: bayes

metric:
  name: final/case2_mean_r2
  goal: maximize

parameters:
  exp_mode:
    values: [case2]
  random_seed:
    values: [46]
  sampling_alpha:
    values: [1.0]
  fgw_alpha:
    values: [1.0]
  soft_tau:
    values: [0.05, 0.1]
  source_lr:
    values: [5e-4, 1e-3, 2e-3]
  source_lr_few:
    values: [5e-4, 1e-3]
  dropout_rate:
    values: [0.3]
  hs_reg:
    values: [0.1, 0.3]
  reg:
    values: [0.1, 0.5]
  n_graphs:
    values: [12, 16]
  n_nodes:
    values: [12, 16]
  few_shot:
    values: [32]

command:
  - ${env}
  - /home/eungyeop/anaconda3/envs/protollm/bin/python
  - ${program}
  - ${args}
  - --base_dir
  - sweep_kf_d256_20260506
  - --source_data
  - mimic_kf
  - eicu_kf
  - hirid_kf
  - sic_kf
  - zigong_kf
  - --basis_type
  - graphormer
  - --batch_size
  - "128"
  - --use_amp
  - --llm_model
  - gemma-medical
  - --embed_type
  - carte_d256
  - --input_dim
  - "256"
  - --train_epochs
  - "150"
  - --pt_patience
  - "15"
  - --ft_patience
  - "15"
