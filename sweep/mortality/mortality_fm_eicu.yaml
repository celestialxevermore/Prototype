program: main_EEE.py
method: bayes

metric:
  name: final/case2_eicu_mortality_auc
  goal: maximize

parameters:
  exp_mode:
    values: [case2]
  random_seed:
    values: [42, 44, 46, 48, 50]
  sampling_alpha:
    values: [1.0]
  fgw_alpha:
    values: [1.0]
  soft_tau:
    values: [0.05, 0.1]
  source_lr:
    values: [5e-4, 1e-3, 2e-3]
  source_lr_few:
    values: [5e-4, 1e-3]
  dropout_rate:
    values: [0.3]
  hs_reg:
    values: [0.1, 0.3]
  reg:
    values: [0.1, 0.5]
  n_graphs:
    values: [12]
  n_nodes:
    values: [12]
  few_shot:
    values: [32]

command:
  - ${env}
  - /home/eungyeop/anaconda3/envs/protollm/bin/python
  - ${program}
  - ${args}
  - --base_dir
  - sweep_fm_icu_mortality_20260424
  - --source_data
  - mimic_mortality
  - eicu_mortality
  - hirid_mortality
  - support_mortality
  - zigong_mortality
  - sic_mortality
  - --basis_type
  - graphormer
  - --batch_size
  - "128"
  - --use_amp
  - --llm_model
  - gpt2_mean
  - --use_mmap_embeddings
