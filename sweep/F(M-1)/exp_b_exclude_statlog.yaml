program: main_EEE.py
method: bayes

metric:
  name: final/few_shot_test_auc_mean
  goal: maximize

parameters:
  exp_mode:
    values: [case2_exclude]
  exclude_sources:
    values:
      - Heart_disease_statlog
  random_seed:
    values: [42, 44, 46, 48, 50, 52, 54, 56, 58, 60, 62, 64, 66, 68, 70, 72, 74, 76, 78, 80]
  sampling_alpha:
    values: [1.0]
  alpha:
    values: [0.3, 0.4, 0.5, 0.6, 0.7]
  fgw_alpha:
    values: [0.5, 1.0, 1.5]
  soft_tau:
    values: [0.01, 0.02, 0.05, 0.1]
  source_lr:
    values: [5e-4, 1e-3, 2e-3]
  source_lr_few:
    values: [1e-4, 5e-4, 1e-3]
  dropout_rate:
    values: [0.1, 0.2, 0.3]
  hs_reg:
    values: [0.1, 0.3, 0.5, 1.0]

command:
  - ${env}
  - /home/eungyeop/anaconda3/envs/protollm/bin/python
  - ${program}
  - ${args}
  - --base_dir
  - exp_b_exclude_statlog_20260416
  - --source_data
  - Medicaldataset
  - Cardiovascular_Disease_Dataset
  - Heart_disease_statlog
  - Erbil_Cardiovascular_Health_Dataset
  - cardio_SAheart
  - heart_failure_clinical_records
  - heart
